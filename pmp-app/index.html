<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a5f" />
  <title>PMP Study — Preparação para a Certificação</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button id="btn-home" class="brand" aria-label="Início">
        <span class="brand-mark">PMP</span>
        <span class="brand-text">Study</span>
      </button>
      <div class="header-right">
        <span id="exam-countdown" class="countdown" title="Contagem para a prova"></span>
        <button id="btn-theme" class="icon-btn" aria-label="Alternar tema">◐</button>
      </div>
    </div>
    <div id="progress-bar-global" class="progress-bar-global"><span></span></div>
  </header>

  <main id="app" class="app-main">
    <!-- Conteúdo renderizado via JS -->
  </main>

  <nav class="bottom-nav">
    <button data-view="home" class="nav-btn active">
      <span class="nav-ico">🏠</span><span>Início</span>
    </button>
    <button data-view="domains" class="nav-btn">
      <span class="nav-ico">📚</span><span>Estudar</span>
    </button>
    <button data-view="quiz-all" class="nav-btn">
      <span class="nav-ico">📝</span><span>Simulado</span>
    </button>
    <button data-view="doubts" class="nav-btn">
      <span class="nav-ico">💬</span><span>Dúvidas</span>
    </button>
  </nav>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
